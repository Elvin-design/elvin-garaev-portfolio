<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Elvin Garaev</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10100f">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <script src="/theme.js"></script>
  <style>
    :root { --bg: #141312; --text: #faf9f5; --sub: rgba(250, 249, 245, 0.64); --focus: #efb78a; color-scheme: dark; }
    :root[data-scheme="light"] { --bg: #f9f9f7; --text: #121217; --sub: #5d5d5d; --focus: #d8574d; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px 20px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; text-align: center;
    }
    main { max-width: 440px; display: grid; justify-items: center; gap: 14px; }
    small { font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--sub); }
    h1 { margin: 0; font-size: 34px; font-weight: 500; letter-spacing: -0.04em; }
    p { margin: 0; font-size: 16px; line-height: 1.6; color: var(--sub); }
    a {
      margin-top: 12px; display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 999px;
      background: var(--text); color: var(--bg); font-size: 14.5px; font-weight: 600; text-decoration: none;
    }
    a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <small>404</small>
    <h1>This page doesn’t exist</h1>
    <p>The link may be old or mistyped. Everything else is on the home page.</p>
    <a href="/">Back to the home page</a>
  </main>
</body>
</html>
